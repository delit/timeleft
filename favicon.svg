<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#141414"/>
  <!-- hourglass outer frame -->
  <rect x="9" y="5" width="14" height="2" rx="1" fill="#c9a96e"/>
  <rect x="9" y="25" width="14" height="2" rx="1" fill="#c9a96e"/>
  <!-- hourglass sides -->
  <path d="M10 7 L16 15.5 L22 7 Z" fill="#c9a96e" opacity="0.55"/>
  <path d="M10 25 L16 16.5 L22 25 Z" fill="#c9a96e" opacity="0.8"/>
  <!-- neck lines -->
  <line x1="10" y1="7" x2="16" y2="15.5" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="7" x2="16" y2="15.5" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="25" x2="16" y2="16.5" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="25" x2="16" y2="16.5" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/>
  <!-- sand drop -->
  <circle cx="16" cy="17.5" r="1.1" fill="#c9a96e"/>
</svg>
